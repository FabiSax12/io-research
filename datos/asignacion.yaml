# Problema propuesto por el grupo (no viene de un enunciado dado).
#
# ENUNCIADO: una empresa de mantenimiento eléctrico de Heredia recibe tres órdenes de trabajo para hoy, en Barva,
# Santo Domingo y San Rafael. Tiene cuatro técnicos disponibles (Andrea, Bryan, Carolina y Daniel). La matriz da el
# tiempo total de cada técnico en cada orden (traslado desde donde está + reparación), en minutos. Cada técnico atiende
# a lo sumo una orden y cada orden la atiende un solo técnico. ¿A quién se asigna cada orden para minimizar el tiempo
# total? Quien no recibe orden queda de guardia (orden ficticia de tiempo 0).
#
# Problema de asignación (versión de programación lineal): 12 variables x_ij en {0,1} y 7 restricciones
# (4 de técnicos, 3 de órdenes). Al no ser cuadrada (4 x 3), el script agrega una orden ficticia de valor 0.
# Se usa en: parte1/python/asignacion.py y parte1/r/asignacion.R
nombre: Asignación de técnicos a órdenes de trabajo
sentido: min                 # min si la matriz es de costos o tiempos, max si es de rendimiento
agentes: [Andrea, Bryan, Carolina, Daniel]
tareas: [Barva, Santo Domingo, San Rafael]
matriz:                      # filas = técnicos, columnas = órdenes (minutos)
  - [50, 35, 60]
  - [45, 40, 30]
  - [55, 30, 40]
  - [40, 50, 45]
